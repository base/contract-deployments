[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
broadcast = 'records'
fs_permissions = [{ access = "read-write", path = "./" }]
optimizer = true
optimizer_runs = 200
auto_detect_solc = true
evm_version = "prague"
via-ir = false
remappings = [
    '@base-contracts/=lib/contracts/',
    '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
    'forge-std/=lib/forge-std/src/',
    'interfaces/=lib/contracts/interfaces/',
    'src/=lib/contracts/src/',
]

[profile.nitro-deploy]
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
evm_version = "cancun"

[profile.tee-registry-deploy]
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "cancun"

# Cobalt deploy profiles. These exist only because base/contracts pins per-contract
# optimizer runs via `compilation_restrictions` in its own foundry.toml, and matching
# its canonical build is what makes the deployed bytecode verifiable. Everything else,
# including remappings, is inherited from the default profile above.
[profile.cobalt-core-deploy]
optimizer = true
optimizer_runs = 5000
bytecode_hash = "none"
evm_version = "cancun"

[profile.cobalt-proofs-deploy]
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "cancun"

[lint]
lint_on_build = false
